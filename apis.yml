aid: feedvisor
name: Feedvisor
description: Feedvisor is an AI-powered agentic commerce platform for brands and large
  sellers on Amazon, unifying advertising optimization, dynamic pricing, and competitive
  market intelligence in a single system. Its Agentis platform and ProductSphere pricing
  technology apply machine learning to manage Buy Box share, sponsored-ads spend (TACoS),
  and margin across an $8B+ GMV base. Feedvisor also exposes an External API secured with
  OAuth2 client-credentials for exporting configuration reports and importing pricing and
  repricing feeds programmatically, letting brands automate listing and repricing operations.
